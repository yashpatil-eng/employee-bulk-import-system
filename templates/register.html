{% extends "main.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">

<div class="login-page">
    <section class="login-card">
        <div class="login-brand">
            <div class="login-logo">EM</div>
            <p class="eyebrow">EMPLOYEE MANAGEMENT</p>
        </div>

        <h1>Create your account</h1>
        <p class="login-subtitle">
            Register to manage your own employee records.
        </p>

        <form id="registerForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password2">Confirm password</label>
                <input
                    type="password"
                    id="password2"
                    name="password2"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div
                id="registerError"
                class="login-error hidden"
                role="alert"
            ></div>

            <p id="registerStatus" class="login-status" role="status"></p>

            <button
                type="submit"
                id="registerButton"
                class="login-button"
            >
                Create account
            </button>
        </form>

        <p class="login-footer">
            Already have an account?
            <a href="{% url 'login' %}">Sign in</a>
        </p>
    </section>
</div>

<script src="{% static 'js/register.js' %}" defer></script>
{% endblock %}
